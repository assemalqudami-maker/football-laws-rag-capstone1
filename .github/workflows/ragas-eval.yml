name: Cohere RAGAS evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_CHAT_MODEL: command-a-03-2025
      COHERE_RERANK_MODEL: rerank-v4.0-pro
      COHERE_EMBED_MODEL: embed-v4.0
      RERANK_PROVIDER: cohere
      RAGAS_JUDGE_MODEL: command-a-03-2025
      RAGAS_EMBED_MODEL: embed-v4.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cohere secret exists
        run: |
          if [ -z "$COHERE_API_KEY" ]; then
            echo "::error::COHERE_API_KEY repository secret is required."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Validate Cohere chat rerank and embed access
        run: python scripts/check_cohere.py

      - name: Build verified corpus and retrieval index
        run: |
          python scripts/check_sources.py
          python scripts/collect_sources.py
          python scripts/extract_sources.py
          python scripts/audit_corpus.py
          python scripts/build_chunks.py
          python scripts/label_gold_chunks.py
          python scripts/build_index.py

      - name: Measure Recall@5 with Cohere Rerank
        run: |
          python scripts/evaluate_recall.py --mode hybrid --reranker-provider cohere
          cp data/eval/recall_report.json data/eval/recall_cohere_rerank.json

      - name: Run required 20-question RAGAS evaluation with Cohere
        run: python scripts/run_ragas.py

      - name: Upload Cohere evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cohere-ragas-evaluation
          path: |
            data/eval/recall_cohere_rerank.json
            data/eval/ragas_report.json
          retention-days: 30
