name: Docker deployment build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-deploy.txt"
      - "app/**"
      - "src/**"
      - "scripts/cache_models.py"
      - "scripts/check_sources.py"
      - "scripts/collect_sources.py"
      - "scripts/extract_sources.py"
      - "scripts/audit_corpus.py"
      - "scripts/build_chunks.py"
      - "scripts/build_index.py"
      - "data/sources_manifest.csv"
      - "data/source_lock.json"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t football-laws-rag:ci .

      - name: Inspect image
        run: |
          docker image inspect football-laws-rag:ci --format='Image size: {{.Size}} bytes'

      - name: Start container
        run: |
          docker run -d --name football-laws-rag-ci -p 7860:7860 \
            -e PORT=7860 \
            -e APP_USERNAME=ci-user \
            -e APP_PASSWORD=ci-password \
            -e OPENAI_API_KEY=ci-placeholder \
            football-laws-rag:ci

      - name: Smoke-test Streamlit health endpoint
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:7860/_stcore/health; then
              echo
              echo "Streamlit health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy."
          docker logs football-laws-rag-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs football-laws-rag-ci || true
