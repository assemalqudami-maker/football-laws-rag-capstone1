name: Docker deployment build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-deploy.txt"
      - "app/**"
      - "src/**"
      - "scripts/cache_models.py"
      - "scripts/check_sources.py"
      - "scripts/collect_sources.py"
      - "scripts/extract_sources.py"
      - "scripts/audit_corpus.py"
      - "scripts/build_chunks.py"
      - "scripts/label_gold_chunks.py"
      - "scripts/build_index.py"
      - "data/sources_manifest.csv"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t football-laws-rag:ci .

      - name: Inspect image
        run: |
          docker image inspect football-laws-rag:ci --format='Image size: {{.Size}} bytes'
