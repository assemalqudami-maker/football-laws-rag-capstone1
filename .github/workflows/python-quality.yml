name: Python quality

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/python-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q app scripts src
